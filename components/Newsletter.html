<!-- ==========================================
     COMPONENT: Stay in the Loop (Newsletter)
     ========================================== -->
<section class="newsletter-section">
  <div class="container-wide">
    <div class="newsletter-card">
      
      <!-- Copy Details -->
      <div class="newsletter-info">
        <h3 class="newsletter-title">STAY IN THE LOOP</h3>
        <p class="newsletter-desc">
          Sign up for new collections, mindful stories and exclusive offers.
        </p>
        <span class="font-script" style="display: block; margin-top: 14px; font-size: 24px; color: var(--color-accent-terracotta);">
          A more conscious tomorrow
        </span>
      </div>

      <!-- Form Box -->
      <div class="newsletter-form-box">
        <form class="newsletter-form" novalidate>
          <input 
            type="email" 
            placeholder="Your email address" 
            class="newsletter-input" 
            required 
            aria-label="Email address"
          />
          <button type="submit" class="newsletter-submit-btn" aria-label="Subscribe">
            <svg viewBox="0 0 24 24">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
        <p class="newsletter-feedback"></p>
      </div>

      <!-- Botanical Background Decor -->
      <img src="assets/images/botanical-branch.png" alt="Botanical Art" class="newsletter-botanical-decor" />

    </div>
  </div>
</section>
