<!-- ==========================================
     COMPONENT: Campaign Banner (Video Area)
     ========================================== -->
<section class="campaign-banner-section" aria-label="Campaign Banner">
  <img src="assets/images/campaign-banner.jpg" alt="Campaign Textured Fabric" class="campaign-bg-img" />
  
  <div class="container-wide">
    <div class="campaign-banner-inner">
      <h3 class="campaign-tagline">Style Today. A Kinder Tomorrow.</h3>
      
      <button type="button" class="campaign-play-btn" aria-label="Watch Our Story Video">
        <div class="campaign-play-icon">
          <svg viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <span class="campaign-play-label">Watch Our Story</span>
      </button>
    </div>
  </div>
</section>

<!-- Video Modal Shell -->
<div class="modal-overlay video-modal-overlay">
  <div class="video-modal-card">
    <button type="button" class="modal-close-btn video-modal-close" style="color: #FFFFFF;" aria-label="Close video">&times;</button>
    <div class="video-placeholder-content">
      <div style="width: 64px; height: 64px; border-radius: 50%; background-color: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
        <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: #FFFFFF; margin-left: 3px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </div>
      <h4 style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 8px;">Marsh Barbary &mdash; Our Story</h4>
      <p style="font-size: 13px; color: rgba(255,255,255,0.7); max-width: 420px; margin: 0 auto;">
        Visual story preview shell. In Phase 2, this will stream our sustainable craftsmanship documentary.
      </p>
    </div>
  </div>
</div>
