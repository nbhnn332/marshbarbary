<!-- ==========================================
     COMPONENT: The Marsh World (Cinematic Campaign Banner)
     Single full-width editorial moment. No tiles, no cards.
     ========================================== -->
<section class="marsh-world-section site-section">
  <div class="container-wide">
    <div class="marsh-world-banner" aria-label="The Marsh World Campaign">
      
      <!-- Single Continuous Campaign Visual -->
      <img 
        src="assets/images/marsh-world-banner.jpg" 
        alt="The Marsh World - Style Today. A Kinder Tomorrow." 
        class="marsh-world-img" 
        loading="lazy" 
      />
      
      <!-- Subtle Editorial Gradient Overlay for Text Legibility -->
      <div class="marsh-world-overlay"></div>

      <!-- Overlaid Editorial Content & CTA -->
      <div class="marsh-world-content">
        <span class="marsh-world-tag">THE MARSH WORLD</span>
        <h2 class="marsh-world-headline">
          Style Today.<br />
          A Kinder Tomorrow.
        </h2>
        
        <!-- Translucent Cinematic CTA Button -->
        <button type="button" class="marsh-world-btn campaign-play-btn" aria-label="Watch Our Story">
          <span class="marsh-world-btn-icon">
            <svg viewBox="0 0 24 24">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
          </span>
          <span>Watch Our Story</span>
        </button>
      </div>

    </div>
  </div>
</section>
