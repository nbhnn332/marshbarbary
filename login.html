<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Sign In & Registration — MARSH BARBARY</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/account-checkout.css" />
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="auth-header">
    <a href="index.html" class="auth-header-logo">
      <img src="assets/images/logo-horizontal.png" alt="MARSH BARBARY" style="height: 28px; width: auto; object-fit: contain;" onerror="this.onerror=null;this.src='assets/images/logo.png';" />
    </a>
    <a href="index.html" class="auth-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Return to Store
    </a>
  </header>

  <!-- Main Container -->
  <main class="auth-main">
    <div class="auth-card">
      <span class="auth-kicker">ATELIER PRIVILEGE</span>
      <h1 class="auth-title" id="auth-main-title">Client Access</h1>
      <p class="auth-subtitle" id="auth-main-subtitle">
        Sign in to manage your orders, saved addresses, and tailored selections.
      </p>

      <!-- Alert Notice -->
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <!-- Navigation Tabs -->
      <nav class="auth-tabs" aria-label="Authentication Options">
        <button type="button" class="auth-tab-btn active" data-tab="signin">Sign In</button>
        <button type="button" class="auth-tab-btn" data-tab="signup">Create Account</button>
        <button type="button" class="auth-tab-btn" data-tab="forgot" style="display: none;">Password</button>
      </nav>

      <!-- ==========================================
           TAB 1: SIGN IN FORM
           ========================================== -->
      <form id="form-signin" class="auth-form-pane active" novalidate>
        <div class="auth-form-group">
          <label for="signin-email" class="auth-label">Email Address</label>
          <input type="email" id="signin-email" class="auth-input" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <div class="auth-form-group">
          <label for="signin-password" class="auth-label">Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="signin-password" class="auth-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="auth-toggle-pwd" data-target="signin-password" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <span class="auth-forgot-link" id="link-to-forgot">Forgot Password?</span>
        <div style="clear: both;"></div>

        <button type="submit" class="auth-submit-btn" id="btn-signin">
          <span>Sign In</span>
          <span class="arrow">&rarr;</span>
        </button>
      </form>

      <!-- ==========================================
           TAB 2: CREATE ACCOUNT FORM
           ========================================== -->
      <form id="form-signup" class="auth-form-pane" novalidate>
        <div class="auth-form-row">
          <div class="auth-form-group">
            <label for="signup-firstname" class="auth-label">First Name</label>
            <input type="text" id="signup-firstname" class="auth-input" placeholder="Aanya" required autocomplete="given-name" />
          </div>
          <div class="auth-form-group">
            <label for="signup-lastname" class="auth-label">Last Name</label>
            <input type="text" id="signup-lastname" class="auth-input" placeholder="Sharma" required autocomplete="family-name" />
          </div>
        </div>

        <div class="auth-form-group">
          <label for="signup-email" class="auth-label">Email Address</label>
          <input type="email" id="signup-email" class="auth-input" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <div class="auth-form-group">
          <label for="signup-phone" class="auth-label">Phone Number</label>
          <input type="tel" id="signup-phone" class="auth-input" placeholder="+91 98765 43210" autocomplete="tel" />
        </div>

        <div class="auth-form-group">
          <label for="signup-password" class="auth-label">Create Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="signup-password" class="auth-input" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password" />
            <button type="button" class="auth-toggle-pwd" data-target="signup-password" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="btn-signup">
          <span>Create Account</span>
          <span class="arrow">&rarr;</span>
        </button>
      </form>

      <!-- ==========================================
           TAB 3: FORGOT PASSWORD FORM
           ========================================== -->
      <form id="form-forgot" class="auth-form-pane" novalidate>
        <div class="auth-form-group">
          <label for="forgot-email" class="auth-label">Registered Email</label>
          <input type="email" id="forgot-email" class="auth-input" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <button type="submit" class="auth-submit-btn" id="btn-forgot" style="margin-bottom: 16px;">
          <span>Send Reset Link</span>
          <span class="arrow">&rarr;</span>
        </button>

        <button type="button" class="btn btn-outline" id="btn-back-to-signin" style="width: 100%; text-align: center;">
          &larr; Back to Sign In
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="auth-footer">
    &copy; 2026 MARSH BARBARY. All rights reserved. &bull; Modest Luxury &bull; Secure Authentication
  </footer>

  <!-- Scripts -->
  <script src="js/lib/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/customer-auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect') || 'index.html';
      const initialTab = urlParams.get('mode') === 'signup' ? 'signup' : 'signin';

      const alertEl = document.getElementById('auth-alert');
      const tabs = document.querySelectorAll('.auth-tab-btn');
      const panes = document.querySelectorAll('.auth-form-pane');
      const mainTitle = document.getElementById('auth-main-title');
      const mainSubtitle = document.getElementById('auth-main-subtitle');

      // Check if already authenticated
      if (window.MB_AUTH.isAuthenticated()) {
        showAlert('You are already signed in. Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 600);
        return;
      }

      function showAlert(msg, type = 'error') {
        alertEl.textContent = msg;
        alertEl.className = `auth-alert ${type}`;
        alertEl.style.display = 'block';
      }

      function clearAlert() {
        alertEl.style.display = 'none';
        alertEl.textContent = '';
      }

      function switchTab(tabName) {
        clearAlert();
        tabs.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
        });
        panes.forEach(pane => {
          pane.classList.toggle('active', pane.id === `form-${tabName}`);
        });

        if (tabName === 'signin') {
          mainTitle.textContent = 'Client Access';
          mainSubtitle.textContent = redirectUrl.includes('checkout')
            ? 'Sign in to access your saved addresses and proceed to secure checkout.'
            : 'Sign in to manage your orders, saved addresses, and tailored selections.';
        } else if (tabName === 'signup') {
          mainTitle.textContent = 'Create Account';
          mainSubtitle.textContent = 'Join the MARSH BARBARY atelier for expedited checkout and order history.';
        } else if (tabName === 'forgot') {
          mainTitle.textContent = 'Reset Password';
          mainSubtitle.textContent = 'Enter your email address and we will send you a secure link to reset your password.';
        }
      }

      tabs.forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
      });

      document.getElementById('link-to-forgot')?.addEventListener('click', () => switchTab('forgot'));
      document.getElementById('btn-back-to-signin')?.addEventListener('click', () => switchTab('signin'));

      // Toggle password visibility
      document.querySelectorAll('.auth-toggle-pwd').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;
          const isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
        });
      });

      // 1. Sign In Submission
      const formSignin = document.getElementById('form-signin');
      formSignin?.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const email = document.getElementById('signin-email').value.trim();
        const password = document.getElementById('signin-password').value;
        const submitBtn = document.getElementById('btn-signin');

        if (!email || !password) {
          showAlert('Please provide both your email address and password.');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.querySelector('span').textContent = 'Signing in...';
          
          await window.MB_AUTH.signIn({ email, password });
          showAlert('Sign in successful. Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 500);
        } catch (err) {
          showAlert(err.message || 'Failed to sign in. Please verify your credentials.');
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Sign In';
        }
      });

      // 2. Sign Up Submission
      const formSignup = document.getElementById('form-signup');
      formSignup?.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const firstName = document.getElementById('signup-firstname').value.trim();
        const lastName = document.getElementById('signup-lastname').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const phone = document.getElementById('signup-phone').value.trim();
        const password = document.getElementById('signup-password').value;
        const submitBtn = document.getElementById('btn-signup');

        if (!firstName || !lastName || !email || !password) {
          showAlert('Please fill in all required fields.');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must contain at least 6 characters.');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.querySelector('span').textContent = 'Creating account...';

          await window.MB_AUTH.signUp({ email, password, firstName, lastName, phone });
          showAlert('Account created successfully! Redirecting...', 'success');

          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 500);
        } catch (err) {
          showAlert(err.message || 'Failed to create account.');
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Create Account';
        }
      });

      // 3. Forgot Password Submission
      const formForgot = document.getElementById('form-forgot');
      formForgot?.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const email = document.getElementById('forgot-email').value.trim();
        const submitBtn = document.getElementById('btn-forgot');

        if (!email) {
          showAlert('Please enter your registered email address.');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.querySelector('span').textContent = 'Sending...';

          await window.MB_AUTH.resetPassword(email);
          showAlert(`A password reset link has been dispatched to ${email}. Please check your inbox.`, 'success');
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Send Reset Link';
        } catch (err) {
          showAlert(err.message || 'Error requesting password reset.');
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Send Reset Link';
        }
      });

      // Set initial tab if requested via URL
      if (initialTab === 'signup') {
        switchTab('signup');
      }
    });
  </script>
</body>
</html>
